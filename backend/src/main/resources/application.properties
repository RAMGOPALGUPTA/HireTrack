spring.application.name=hiretrack-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hiretrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:HireTrackLocalDevelopmentSecretKeyChangeBeforeProduction2026}
app.jwt.expiration-ms=86400000
